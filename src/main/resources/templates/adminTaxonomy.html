<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دسته‌بندی‌ها و برچسب‌ها — درنگ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Vazirmatn:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/bootstrap.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/admin-style.css">
    <script> (function () {
        try {
            const saved = localStorage.getItem("derang-theme");
            document.documentElement.setAttribute("data-theme", saved || "light");
        } catch (e) {
            document.documentElement.setAttribute("data-theme", "light");
        }
    })(); </script>

    <style>
        .tx-add-inner.has-desc {
            flex-direction: column;
            align-items: stretch;
            border-radius: var(--radius-lg);
            padding: 14px;
        }

        .tx-add-inner.has-desc .tx-add-row {
            display: flex;
            gap: 10px;
        }

        .tx-add-desc {
            width: 100%;
            margin-top: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, .5);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-family: inherit;
            font-size: .9rem;
            color: var(--ink);
            resize: vertical;
            min-height: 60px;
        }

        html[data-theme="dark"] .tx-add-desc {
            background: rgba(255, 255, 255, .06);
        }

        .tx-desc-cell {
            color: var(--ink-soft);
            font-size: .85rem;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tx-edit-desc {
            width: 100%;
            margin-top: 6px;
            max-width: 320px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: .85rem;
            color: var(--ink);
            background: rgba(255, 255, 255, .6);
            border: 1px solid var(--terracotta);
            border-radius: var(--radius-md);
            outline: none;
            resize: vertical;
            min-height: 44px;
        }


        .tx-add {
            max-width: 1120px;
            margin: 14px auto 0;
            padding: 0 32px;
        }

        .tx-add-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 10px 10px 12px;
            background: rgba(255, 255, 255, .24);
            border: 1px solid rgba(255, 255, 255, .5);
            border-radius: 999px;
            backdrop-filter: blur(18px) saturate(170%);
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            box-shadow: 0 12px 28px rgba(43, 38, 33, .07), inset 0 1px 0 rgba(255, 255, 255, .6);
            transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
        }

        .tx-add-inner:focus-within {
            border-color: var(--terracotta);
            box-shadow: 0 0 0 4px rgba(217, 119, 87, .14), 0 12px 28px rgba(43, 38, 33, .07);
        }

        .tx-add-inner input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            padding: 8px 14px;
            font-family: inherit;
            font-size: .96rem;
            color: var(--ink);
        }

        .tx-add-inner .btn-primary {
            padding: 10px 22px;
            flex-shrink: 0;
        }

        .tx-error {
            max-width: 1120px;
            margin: 8px auto 0;
            padding: 0 44px;
            min-height: 1.2em;
            font-size: .82rem;
            color: var(--terracotta-dk);
        }

        .tx-name {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: .98rem;
            color: var(--ink);
        }

        .tx-name .tx-mark {
            color: var(--terracotta);
            font-weight: 700;
        }

        .tx-name .tx-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--terracotta);
            box-shadow: 0 0 0 4px rgba(217, 119, 87, .16);
        }

        .tx-edit-input {
            width: 100%;
            max-width: 320px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: .92rem;
            color: var(--ink);
            background: rgba(255, 255, 255, .6);
            border: 1px solid var(--terracotta);
            border-radius: var(--radius-md);
            outline: none;
        }

        .tx-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            padding: 2px 11px;
            border-radius: 999px;
            font-size: .78rem;
            font-weight: 600;
            color: var(--terracotta-dk);
            background: rgba(217, 119, 87, .12);
            border: 1px solid rgba(217, 119, 87, .3);
        }

        .tx-count.is-zero {
            color: var(--ink-soft);
            background: transparent;
            border-style: dashed;
            border-color: var(--line);
        }

        .comments-table td.cell-num-center,
        .comments-table th.col-center {
            text-align: center;
        }

        .comment-action-btn.edit-btn:hover {
            background: linear-gradient(140deg, #E89A6F, var(--terracotta));
            border-color: transparent;
            color: #fff;
        }

        .glass-alert-error {
            margin: -12px 0 18px;
            font-size: .84rem;
            color: var(--terracotta-dk);
        }

        table.comments-table.tx-table {
            min-width: 520px;
        }

        @media (max-width: 900px) {
            .tx-add {
                padding: 0 20px;
            }

            .tx-error {
                padding: 0 32px;
            }
        }

        html[data-theme="dark"] .tx-add-inner,
        html[data-theme="dark"] .tx-edit-input {
            background: rgba(255, 255, 255, .05);
            border-color: rgba(255, 255, 255, .12);
        }

        html[data-theme="dark"] .tx-add-inner:focus-within,
        html[data-theme="dark"] .tx-edit-input {
            border-color: var(--terracotta);
        }
    </style>
</head>
<body>

<div class="page-loader" id="page-loader">
    <div class="page-loader-mark">
        <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 1.5 C12.6 7.8 14.2 9.4 20.5 10 C14.2 10.6 12.6 12.2 12 18.5 C11.4 12.2 9.8 10.6 3.5 10 C9.8 9.4 11.4 7.8 12 1.5 Z"/>
        </svg>
    </div>
</div>

<div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
</div>

<header class="site-header">
    <div class="header-inner admin-header-inner">
        <a href="http://localhost:8080/admin" class="logo">
            <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 1.5 C12.6 7.8 14.2 9.4 20.5 10 C14.2 10.6 12.6 12.2 12 18.5 C11.4 12.2 9.8 10.6 3.5 10 C9.8 9.4 11.4 7.8 12 1.5 Z"/>
            </svg>
            درنگ
            <span class="admin-badge">مدیریت</span>
        </a>

        <div class="header-right admin-header-actions">
            <button class="search-trigger" type="button" id="search-trigger" aria-label="جستجوی سریع">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M21 21l-4.3-4.3"/>
                </svg>
                <span class="search-trigger-label">جستجو</span>
                <kbd class="search-kbd">⌘K</kbd>
            </button>

            <button class="theme-toggle" type="button" id="theme-toggle" aria-label="تغییر پوسته">
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7">
                    <circle cx="12" cy="12" r="4.2"/>
                    <path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
                </svg>
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7">
                    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>
                </svg>
            </button>

            <a href="http://localhost:8080/admin" class="admin-exit-link">
                <span>بازگشت به پنل</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M15 5 L8 12 L15 19"/>
                </svg>
            </a>
        </div>
    </div>
</header>

<main>

    <section class="admin-hero reveal">
        <p class="eyebrow">پنل مدیریت درنگ</p>
        <h1 class="admin-title">دسته‌بندی‌ها و برچسب‌ها</h1>
        <p class="admin-sub">موضوع‌های بلاگ‌ها را بسازید، نام آن‌ها را ویرایش کنید یا حذفشان کنید.</p>
    </section>

    <section class="comments-toolbar reveal">
        <div class="filter-group" role="tablist">
            <button type="button" class="filter-pill is-active" id="tab-categories" data-tab="categories"
                    role="tab">
                دسته‌بندی‌ها <span class="filter-pill-count" id="count-categories">۰</span>
            </button>
            <button type="button" class="filter-pill" id="tab-tags" data-tab="tags" role="tab">
                برچسب‌ها <span class="filter-pill-count" id="count-tags">۰</span>
            </button>
        </div>
    </section>

    <section class="tx-add reveal">
        <div class="tx-add-inner" id="add-inner">
            <div class="tx-add-row">
                <input type="text" id="add-input" maxlength="60" autocomplete="off" placeholder="نام دسته‌بندی جدید">
                <button class="btn btn-primary" type="button" id="add-btn">افزودن</button>
            </div>
            <textarea class="tx-add-desc" id="add-desc-input" maxlength="300" placeholder="توضیح دسته‌بندی (الزامی)" style="display:none;"></textarea>
        </div>
    </section>
    <p class="tx-error" id="add-error" aria-live="polite"></p>

    <section class="comments-wrap reveal">
        <div class="comments-table-shell">

            <div class="comments-skeleton" id="tx-skeleton">
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
            </div>

            <div class="comments-table-scroll" id="table-scroll" style="display:none;">
                <table class="comments-table tx-table">
                    <thead>
                    <tr>
                        <th class="col-author">نام</th>
                        <th class="col-center">تعداد بلاگ</th>
                        <th class="col-actions">عملیات</th>
                    </tr>
                    </thead>
                    <tbody id="tx-tbody"></tbody>
                </table>
            </div>

            <div class="comments-empty" id="tx-empty" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                    <path d="M4 5.5 h16 a1 1 0 0 1 1 1 v9 a1 1 0 0 1 -1 1 H9 l-4.5 4 v-4 H4 a1 1 0 0 1 -1 -1 v-9 a1 1 0 0 1 1 -1 Z"/>
                </svg>
                <p id="tx-empty-text">موردی وجود ندارد.</p>
            </div>

        </div>
    </section>

</main>

<div class="cmdk-overlay" id="cmdk-overlay">
    <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="جستجوی سریع">
        <div class="cmdk-input-wrap">
            <svg class="cmdk-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="11" cy="11" r="7"/>
                <path d="M21 21l-4.3-4.3"/>
            </svg>
            <input type="text" id="cmdk-input" class="cmdk-input" placeholder="جستجو در بخش‌های مدیریت…"
                   autocomplete="off">
            <kbd class="cmdk-esc">Esc</kbd>
        </div>
        <div class="cmdk-list" id="cmdk-list"></div>
    </div>
</div>

<div class="glass-overlay" id="glass-alert-overlay">
    <div class="glass-alert">
        <button class="glass-alert-close" type="button" id="glass-alert-close" aria-label="بستن">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M5 5 L19 19 M19 5 L5 19"/>
            </svg>
        </button>

        <h3 class="glass-alert-title" id="glass-alert-title"></h3>
        <p class="glass-alert-text" id="glass-alert-text"></p>
        <p class="glass-alert-error" id="glass-alert-error"></p>

        <div style="display:flex;gap:10px;justify-content:center">
            <button class="btn btn-primary" type="button" id="confirm-delete-btn">حذف</button>
            <button class="bulk-btn clear" type="button" id="cancel-delete-btn">انصراف</button>
        </div>
    </div>
</div>

<footer class="site-footer admin-footer">
    <div class="footer-bottom admin-footer-bottom">
        <div class="admin-footer-brand">
            <svg class="logo-mark small" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 1.5 C12.6 7.8 14.2 9.4 20.5 10 C14.2 10.6 12.6 12.2 12 18.5 C11.4 12.2 9.8 10.6 3.5 10 C9.8 9.4 11.4 7.8 12 1.5 Z"/>
            </svg>
            <span>پنل مدیریت درنگ</span>
        </div>
        <p>© ۱۴۰۵ درنگ. دسترسی محدود به مدیران سایت.</p>
    </div>
</footer>

<script>
    const API = "http://localhost:8080";


    const TABS = {
        categories: {
            url: "/categories",
            addPlaceholder: "نام دسته‌بندی جدید",
            empty: "هنوز دسته‌بندی‌ای ساخته نشده است. از نوار بالا اولین دسته‌بندی را بسازید.",
            deleteTitle: "حذف دسته‌بندی",
            usedBy: blog => blog.category ? [blog.category.id] : [],
            hasDescription: true
        },
        tags: {
            url: "/tags",
            addPlaceholder: "نام برچسب جدید (بدون #)",
            empty: "هنوز برچسبی ساخته نشده است. از نوار بالا اولین برچسب را بسازید.",
            deleteTitle: "حذف برچسب",
            usedBy: blog => (blog.tags || []).map(t => t.id),
            hasDescription: false
        }
    };

    const state = {
        tab: "categories",
        items: {categories: [], tags: []},
        usage: {categories: {}, tags: {}},
        editingId: null,
        pendingDelete: null
    };

    const $ = id => document.getElementById(id);
    const fa = n => Number(n).toLocaleString("fa-IR");
    const esc = s => String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));


    async function getJson(path) {
        const res = await fetch(API + path);
        if (!res.ok) throw new Error(path + " " + res.status);
        return res.json();
    }

    async function loadAll() {
        $("tx-skeleton").style.display = "flex";
        $("table-scroll").style.display = "none";
        $("tx-empty").style.display = "none";

        const [cats, tags, blogs] = await Promise.all([
            getJson(TABS.categories.url).catch(() => []),
            getJson(TABS.tags.url).catch(() => []),
            getJson("/blogs").catch(() => [])
        ]);
        state.items.categories = cats;
        state.items.tags = tags;

        for (const key of Object.keys(TABS)) {
            const usage = {};
            blogs.forEach(b => TABS[key].usedBy(b).forEach(id => usage[id] = (usage[id] || 0) + 1));
            state.usage[key] = usage;
        }

        $("count-categories").innerText = fa(cats.length);
        $("count-tags").innerText = fa(tags.length);
        $("tx-skeleton").style.display = "none";
        render();
    }


    function render() {
        const cfg = TABS[state.tab];
        const items = state.items[state.tab];
        const usage = state.usage[state.tab];

        $("add-input").placeholder = cfg.addPlaceholder;
        $("add-desc-input").style.display = cfg.hasDescription ? "block" : "none";
        $("add-inner").classList.toggle("has-desc", cfg.hasDescription);
        $("tx-empty-text").innerText = cfg.empty;
        $("tx-empty").style.display = items.length ? "none" : "block";
        $("table-scroll").style.display = items.length ? "block" : "none";

        $("tx-tbody").innerHTML = items.map(item => {
            const count = usage[item.id] || 0;
            const isEditing = state.editingId === item.id;
            const mark = state.tab === "tags"
                ? `<span class="tx-mark">#</span>`
                : `<span class="tx-dot"></span>`;

            const nameCell = isEditing
                ? `<input class="tx-edit-input" id="edit-input" maxlength="60" value="${esc(item.name)}">
               ${cfg.hasDescription ? `<textarea class="tx-edit-desc" id="edit-desc-input" maxlength="300" placeholder="توضیح دسته‌بندی">${esc(item.description || "")}</textarea>` : ""}`
                : `<span class="tx-name">${mark}${esc(item.name)}</span>
               ${cfg.hasDescription ? `<div class="tx-desc-cell" title="${esc(item.description || "")}">${esc(item.description || "")}</div>` : ""}`;

            const actions = isEditing
                ? `<button class="comment-action-btn accept-btn" data-act="save" data-id="${item.id}" title="ذخیره">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L9.5 18 L20 6"/></svg>
               </button>
               <button class="comment-action-btn" data-act="cancel" data-id="${item.id}" title="انصراف">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
               </button>`
                : `<button class="comment-action-btn edit-btn" data-act="edit" data-id="${item.id}" title="ویرایش نام">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16v4Z M13.5 6.5l4 4"/></svg>
               </button>
               <button class="comment-action-btn delete-btn" data-act="delete" data-id="${item.id}" title="حذف">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14 M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2 M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13 M10 11v6 M14 11v6"/></svg>
               </button>`;

            return `
            <tr data-id="${item.id}">
                <td class="cell-author-td">${nameCell}</td>
                <td class="cell-num-center" style="text-align:center">
                    <span class="tx-count ${count ? "" : "is-zero"}">${fa(count)}</span>
                </td>
                <td class="col-actions"><div class="row-actions">${actions}</div></td>
            </tr>`;
        }).join("");

        if (state.editingId !== null) {
            const input = $("edit-input");
            if (input) {
                input.focus();
                input.select();
                input.addEventListener("keydown", e => {
                    if (e.key === "Enter" && !e.shiftKey) saveEdit(state.editingId);
                    if (e.key === "Escape") {
                        state.editingId = null;
                        render();
                    }
                });
            }
        }
    }


    function showError(msg) {
        $("add-error").innerText = msg || "";
    }

    function nameExists(name, ignoreId) {
        return state.items[state.tab].some(i =>
            i.id !== ignoreId && i.name.trim().toLowerCase() === name.toLowerCase());
    }

    async function addItem() {
        const cfg = TABS[state.tab];
        const name = $("add-input").value.trim().replace(/^#/, "");
        const description = $("add-desc-input").value.trim();

        if (!name) return showError("یک نام وارد کنید.");
        if (cfg.hasDescription && !description) return showError("وارد کردن توضیح الزامی است.");
        if (nameExists(name)) return showError("این نام قبلاً ثبت شده است.");

        showError("");

        const body = cfg.hasDescription ? {name, description} : {name};

        const res = await fetch(API + cfg.url, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        }).catch(() => null);

        if (!res || !res.ok) return showError("ذخیره انجام نشد. دوباره تلاش کنید.");
        $("add-input").value = "";
        $("add-desc-input").value = "";
        await loadAll();
    }

    async function saveEdit(id) {
        const cfg = TABS[state.tab];
        const input = $("edit-input");
        const name = input.value.trim().replace(/^#/, "");
        const descInput = $("edit-desc-input");
        const description = descInput ? descInput.value.trim() : undefined;

        if (!name) return;
        if (cfg.hasDescription && !description) {
            descInput.style.borderColor = "var(--terracotta-dk)";
            return;
        }
        if (nameExists(name, id)) {
            input.style.borderColor = "var(--terracotta-dk)";
            return;
        }

        const body = cfg.hasDescription ? {id, name, description} : {id, name};

        const res = await fetch(API + cfg.url + "/" + id, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        }).catch(() => null);

        if (!res || !res.ok) {
            input.style.borderColor = "var(--terracotta-dk)";
            return;
        }
        state.editingId = null;
        await loadAll();
    }


    function openDelete(id) {
        const item = state.items[state.tab].find(i => i.id === id);
        const count = state.usage[state.tab][id] || 0;
        state.pendingDelete = id;

        $("glass-alert-title").innerText = TABS[state.tab].deleteTitle;
        $("glass-alert-text").innerText = count
            ? `«${item.name}» در ${fa(count)} بلاگ استفاده شده است. با حذف آن، از این بلاگ‌ها برداشته می‌شود. ادامه می‌دهید؟`
            : `آیا مطمئن هستید که می‌خواهید «${item.name}» را حذف کنید؟`;
        $("glass-alert-error").innerText = "";
        $("glass-alert-overlay").classList.add("is-open");
    }

    function closeDelete() {
        $("glass-alert-overlay").classList.remove("is-open");
        state.pendingDelete = null;
    }

    $("cancel-delete-btn").addEventListener("click", closeDelete);
    $("glass-alert-close").addEventListener("click", closeDelete);

    $("confirm-delete-btn").addEventListener("click", async () => {
        if (state.pendingDelete === null) return;
        const res = await fetch(API + TABS[state.tab].url + "/" + state.pendingDelete, {method: "DELETE"})
            .catch(() => null);

        if (!res || !res.ok) {
            $("glass-alert-error").innerText = "حذف انجام نشد. ممکن است هنوز به بلاگ‌ها وصل باشد.";
            return;
        }
        closeDelete();
        await loadAll();
    });


    function switchTab(tab) {
        state.tab = tab;
        state.editingId = null;
        showError("");
        $("add-input").value = "";
        document.querySelectorAll("[data-tab]").forEach(b =>
            b.classList.toggle("is-active", b.dataset.tab === tab));
        history.replaceState(null, "", tab === "tags" ? "?tab=tags" : location.pathname);
        render();
    }

    document.querySelectorAll("[data-tab]").forEach(b =>
        b.addEventListener("click", () => switchTab(b.dataset.tab)));

    $("add-btn").addEventListener("click", addItem);
    $("add-input").addEventListener("keydown", e => {
        if (e.key === "Enter") addItem();
    });
    $("add-input").addEventListener("input", () => showError(""));

    $("tx-tbody").addEventListener("click", e => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const id = Number(btn.dataset.id);
        switch (btn.dataset.act) {
            case "edit":
                state.editingId = id;
                render();
                break;
            case "cancel":
                state.editingId = null;
                render();
                break;
            case "save":
                saveEdit(id);
                break;
            case "delete":
                openDelete(id);
                break;
        }
    });

    if (new URLSearchParams(location.search).get("tab") === "tags") switchTab("tags");
    loadAll();

    window.addEventListener("load", () => {
        const loader = $("page-loader");
        const revealNow = () => {
            document.querySelectorAll(".reveal").forEach((el, i) => {
                const delay = i * 70;
                el.style.transitionDelay = `${delay}ms`;
                requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("visible")));
                setTimeout(() => {
                    el.style.transitionDelay = "";
                }, delay + 850);
            });
        };
        if (loader) {
            setTimeout(() => {
                loader.classList.add("is-hidden");
                revealNow();
            }, 450);
        } else {
            revealNow();
        }
    });
</script>

<script>

    const themeToggle = document.getElementById("theme-toggle");
    const rootEl = document.documentElement;

    function applyTheme(theme) {
        rootEl.setAttribute("data-theme", theme);
        try {
            localStorage.setItem("derang-theme", theme);
        } catch (e) {
        }
    }

    if (themeToggle) {
        themeToggle.addEventListener("click", () => {
            applyTheme(rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark");
        });
    }


    const cmdkData = [
        {title: "پنل مدیریت", sub: "بازگشت به صفحه اصلی مدیریت", href: "http://localhost:8080/admin"},
        {title: "بلاگ‌ها", sub: "نوشتن، ویرایش و انتشار بلاگ‌ها", href: "http://localhost:8080/admin/blogs"},
        {title: "دسته‌بندی‌ها و برچسب‌ها", sub: "ساخت و ویرایش موضوع‌های بلاگ", href: "http://localhost:8080/admin/categories"},
        {title: "کاربران", sub: "حساب‌های کاربری و دسترسی‌ها", href: "http://localhost:8080/admin/users"},
        {title: "دیدگاه‌ها", sub: "بررسی، تأیید یا حذف دیدگاه‌ها", href: "http://localhost:8080/admin/comments"},
        {title: "بازگشت به سایت", sub: "خروج از پنل مدیریت", href: "http://localhost:8080"}
    ];

    const cmdkOverlay = document.getElementById("cmdk-overlay");
    const cmdkInput = document.getElementById("cmdk-input");
    const cmdkList = document.getElementById("cmdk-list");
    let cmdkActiveIndex = 0;
    let cmdkFiltered = cmdkData;

    function renderCmdk() {
        if (!cmdkFiltered.length) {
            cmdkList.innerHTML = `<p class="cmdk-empty">نتیجه‌ای پیدا نشد.</p>`;
            return;
        }
        cmdkList.innerHTML = cmdkFiltered.map((item, i) => `
            <div class="cmdk-item ${i === cmdkActiveIndex ? "is-active" : ""}" data-index="${i}">
                <svg class="cmdk-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                    <circle cx="12" cy="12" r="9"/>
                </svg>
                <div class="cmdk-item-text">
                    <span class="cmdk-item-title">${item.title}</span>
                    <span class="cmdk-item-sub">${item.sub}</span>
                </div>
            </div>`).join("");

        cmdkList.querySelectorAll(".cmdk-item").forEach(el => {
            const i = parseInt(el.dataset.index, 10);
            el.addEventListener("click", () => {
                window.location.href = cmdkFiltered[i].href;
            });
            el.addEventListener("mousemove", () => {
                if (cmdkActiveIndex !== i) {
                    cmdkActiveIndex = i;
                    renderCmdk();
                }
            });
        });
    }

    function openCmdk() {
        cmdkOverlay.classList.add("is-open");
        document.body.style.overflow = "hidden";
        cmdkInput.value = "";
        cmdkFiltered = cmdkData;
        cmdkActiveIndex = 0;
        renderCmdk();
        setTimeout(() => cmdkInput.focus(), 50);
    }

    function closeCmdk() {
        cmdkOverlay.classList.remove("is-open");
        document.body.style.overflow = "";
    }

    cmdkInput.addEventListener("input", () => {
        const q = cmdkInput.value.trim().toLowerCase();
        cmdkFiltered = cmdkData.filter(item =>
            item.title.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q));
        cmdkActiveIndex = 0;
        renderCmdk();
    });

    cmdkInput.addEventListener("keydown", e => {
        if (e.key === "ArrowDown") {
            e.preventDefault();
            cmdkActiveIndex = Math.min(cmdkActiveIndex + 1, cmdkFiltered.length - 1);
            renderCmdk();
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            cmdkActiveIndex = Math.max(cmdkActiveIndex - 1, 0);
            renderCmdk();
        } else if (e.key === "Enter") {
            e.preventDefault();
            if (cmdkFiltered[cmdkActiveIndex]) window.location.href = cmdkFiltered[cmdkActiveIndex].href;
        }
    });

    document.getElementById("search-trigger").addEventListener("click", openCmdk);
    cmdkOverlay.addEventListener("click", e => {
        if (e.target === cmdkOverlay) closeCmdk();
    });

    document.addEventListener("keydown", e => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            cmdkOverlay.classList.contains("is-open") ? closeCmdk() : openCmdk();
        }
        if (e.key === "Escape" && cmdkOverlay.classList.contains("is-open")) closeCmdk();
    });
</script>

</body>
</html>
