<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت بلاگ‌ها — درنگ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Vazirmatn:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/bootstrap.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/admin-style.css">
    <!--    <link rel="stylesheet" href="/login-style.css">-->
    <script> (function () {
        try {
            const saved = localStorage.getItem("derang-theme");
            const theme = saved || "light";
            document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
            document.documentElement.setAttribute("data-theme", "light");
        }
    })(); </script>
</head>
<body>

<div class="page-loader" id="page-loader">
    <div class="page-loader-mark">
        <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 1.5 C12.6 7.8 14.2 9.4 20.5 10 C14.2 10.6 12.6 12.2 12 18.5 C11.4 12.2 9.8 10.6 3.5 10 C9.8 9.4 11.4 7.8 12 1.5 Z"/>
        </svg>
    </div>
</div>

<div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
</div>

<header class="site-header">
    <div class="header-inner admin-header-inner">
        <a href="http://localhost:8080/admin" class="logo">
            <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 1.5 C12.6 7.8 14.2 9.4 20.5 10 C14.2 10.6 12.6 12.2 12 18.5 C11.4 12.2 9.8 10.6 3.5 10 C9.8 9.4 11.4 7.8 12 1.5 Z"/>
            </svg>
            درنگ
            <span class="admin-badge">مدیریت</span>
        </a>

        <div class="header-right admin-header-actions">
            <button class="search-trigger" type="button" id="search-trigger" aria-label="جستجوی سریع"
                    onclick="window.location.href='http://localhost:8080/search?focus=1'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M21 21l-4.3-4.3"/>
                </svg>
                <span class="search-trigger-label">جستجو</span>
                <kbd class="search-kbd">⌘K</kbd>
            </button>

            <button class="theme-toggle" type="button" id="theme-toggle" aria-label="تغییر پوسته">
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7">
                    <circle cx="12" cy="12" r="4.2"/>
                    <path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
                </svg>
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7">
                    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>
                </svg>
            </button>

            <a href="http://localhost:8080" class="admin-exit-link">
                <span>بازگشت به سایت</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M15 5 L8 12 L15 19"/>
                </svg>
            </a>
        </div>
    </div>
</header>

<main>

    <section class="admin-hero reveal">
        <p class="eyebrow">پنل مدیریت درنگ</p>
        <h1 class="admin-title">مدیریت بلاگ‌ها</h1>
        <p class="admin-sub">نوشته‌های وبلاگ را اضافه، ویرایش یا حذف کنید.</p>
    </section>

    <section class="comments-toolbar reveal">

        <div class="filter-group" id="status-filters">
            <button class="filter-pill is-active" type="button" data-filter="ALL">
                همه <span class="filter-pill-count" id="count-all">۰</span>
            </button>
            <button class="filter-pill" type="button" data-filter="PUBLISHED">
                <i class="pill-dot dot-published"></i>منتشر شده <span class="filter-pill-count" id="count-published">۰</span>
            </button>
            <button class="filter-pill" type="button" data-filter="DRAFT">
                <i class="pill-dot dot-draft"></i>پیش‌نویس <span class="filter-pill-count" id="count-draft">۰</span>
            </button>
        </div>

        <button class="btn btn-primary" type="button" id="add-blog-btn">
            بلاگ جدید
        </button>
    </section>

    <section class="comments-wrap reveal">
        <div class="comments-table-shell">

            <div class="comments-skeleton" id="blogs-skeleton" style="display:none;">
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
            </div>

            <div class="comments-table-scroll" id="table-scroll">
                <table class="comments-table">
                    <thead>
                    <tr>
                        <th class="col-author">بلاگ</th>
                        <th class="col-cat">دسته‌بندی و برچسب‌ها</th>
                        <th class="col-post">نویسنده</th>
                        <th class="col-status">وضعیت</th>
                        <th class="col-num">آمار</th>
                        <th class="col-actions">عملیات</th>
                    </tr>
                    </thead>
                    <tbody id="blogs-tbody"></tbody>
                </table>
            </div>

            <div class="comments-empty" id="blogs-empty" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                    <path d="M4 4h16v16H4z"/>
                    <path d="M8 9h8M8 13h5"/>
                </svg>
                <p id="blogs-empty-text">هنوز بلاگی ثبت نشده است.</p>
            </div>

        </div>
    </section>

</main>

<div class="cmdk-overlay" id="cmdk-overlay">
    <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="جستجوی سریع">
        <div class="cmdk-input-wrap">
            <svg class="cmdk-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="11" cy="11" r="7"/>
                <path d="M21 21l-4.3-4.3"/>
            </svg>
            <input type="text" id="cmdk-input" class="cmdk-input" placeholder="جستجو در بخش‌های مدیریت…"
                   autocomplete="off">
            <kbd class="cmdk-esc">Esc</kbd>
        </div>
        <div class="cmdk-list" id="cmdk-list"></div>
    </div>
</div>

<div class="glass-overlay" id="glass-alert-overlay">
    <div class="glass-alert">
        <button class="glass-alert-close" type="button" id="glass-alert-close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M5 5 L19 19 M19 5 L5 19"/>
            </svg>
        </button>

        <h3 class="glass-alert-title" id="glass-alert-title"></h3>
        <p class="glass-alert-text" id="glass-alert-text"></p>

        <div style="display:flex;gap:10px;justify-content:center">
            <button class="btn btn-primary" id="confirm-delete-btn">حذف</button>
            <button class="bulk-btn clear" id="cancel-delete-btn">انصراف</button>
        </div>
    </div>
</div>

<footer class="site-footer admin-footer">
    <div class="footer-bottom admin-footer-bottom">
        <div class="admin-footer-brand">
            <svg class="logo-mark small" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 1.5 C12.6 7.8 14.2 9.4 20.5 10 C14.2 10.6 12.6 12.2 12 18.5 C11.4 12.2 9.8 10.6 3.5 10 C9.8 9.4 11.4 7.8 12 1.5 Z"/>
            </svg>
            <span>پنل مدیریت درنگ</span>
        </div>
        <p>© ۱۴۰۵ درنگ. دسترسی محدود به مدیران سایت.</p>
    </div>
</footer>

<script>
    let targetSlug = new URLSearchParams(window.location.search).get("target");
    document.getElementById("add-blog-btn").addEventListener("click", () => {
        window.location.href = "http://localhost:8080/admin/blog-edit";
    });

    let allBlogs = [];
    let activeFilter = "ALL";

    const API = "http://localhost:8080";
    const keyOf = (o) => String(o.slug ?? o.id ?? o.name);
    const fa = (n) => Number(n).toLocaleString("fa-IR");
    const dateFmt = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {year: "numeric", month: "short", day: "numeric"});

    function esc(str) {
        return String(str ?? "").replace(/[&<>"']/g, ch => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
    }

    async function loadBlogs() {
        allBlogs = await fetch("http://localhost:8080/blogs").then(res => res.json());

        document.getElementById("count-all").innerText = fa(allBlogs.length);
        document.getElementById("count-published").innerText = fa(allBlogs.filter(b => b.status === "PUBLISHED").length);
        document.getElementById("count-draft").innerText = fa(allBlogs.filter(b => b.status !== "PUBLISHED").length);

        renderBlogs();
        highlightTargetRow();
    }

    function renderBlogs() {
        const list = allBlogs.filter(b =>
            activeFilter === "ALL" ? true :
                activeFilter === "PUBLISHED" ? b.status === "PUBLISHED" : b.status !== "PUBLISHED"
        );

        document.getElementById("blogs-empty").style.display = list.length ? "none" : "block";
        document.getElementById("blogs-empty-text").innerText =
            allBlogs.length ? "بلاگی در این دسته وجود ندارد." : "هنوز بلاگی ثبت نشده است.";
        document.getElementById("table-scroll").style.display = list.length ? "" : "none";

        document.getElementById("blogs-tbody").innerHTML = list.map((b, i) => blogRow(b, i)).join("");
    }

    function blogRow(blog, index = 0) {
        const readingTime = fa(Math.max(1, Math.ceil((blog.content || "").length / 1200)));
        const published = blog.status === "PUBLISHED";
        const hasDate = blog.publishedDate && !Number.isNaN(new Date(blog.publishedDate).getTime());
        const tags = blog.tags || [];
        const shownTags = tags.slice(0, 3);
        const extra = tags.length - shownTags.length;

        const check = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
        const pencil = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
        const eye = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const clock = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;

        return `
    <tr class="row-enter ${published ? "is-published" : "is-draft"}" data-id="${blog.id}" data-slug="${esc(blog.slug)}" style="animation-delay:${index * 40}ms">
        <td class="cell-author-td">
            <div class="cell-author">
                <span class="author-avatar blog-thumb">
                    <img src="${esc(blog.imageAddress)}" alt="">
                </span>
                <div class="title-stack">
                    <a href="http://localhost:8080/admin/blog-edit/${encodeURIComponent(blog.slug)}"
                       class="author-name link-underline" title="${esc(blog.description)}">${esc(blog.title)}</a>
                    ${blog.slug ? `<span class="slug-text" dir="ltr">/${esc(blog.slug)}</span>` : ""}
                </div>
            </div>
        </td>
        <td class="cell-cats">
            ${blog.category
                    ? `<a class="post-category" href="${API}/search?category=${encodeURIComponent(keyOf(blog.category))}">
                       <svg class="post-category-icon" viewBox="0 0 24 24" aria-hidden="true">
                           <path d="M12 1.5 C12.6 7.8 14.2 9.4 20.5 10 C14.2 10.6 12.6 12.2 12 18.5 C11.4 12.2 9.8 10.6 3.5 10 C9.8 9.4 11.4 7.8 12 1.5 Z"/>
                       </svg>
                       <span class="post-category-label">دسته‌بندی</span>
                       <span class="post-category-sep"></span>
                       <span class="post-category-name">${esc(blog.category.name)}</span>
                   </a>`
                    : `<span class="muted">—</span>`}
            ${shownTags.length ? `<div class="card-tags">
                ${shownTags.map(t => `<a class="card-tag" href="${API}/search?tag=${encodeURIComponent(keyOf(t))}">#${esc(t.name)}</a>`).join("")}
                ${extra > 0 ? `<span class="card-tag card-tag-more">+${fa(extra)}</span>` : ""}
            </div>` : ""}
        </td>
        <td class="cell-byline">
            <span class="byline-name">${esc(blog.author)}</span>
            <span class="byline-date">${hasDate ? dateFmt.format(new Date(blog.publishedDate)) : "—"}</span>
        </td>
        <td class="cell-status">
            <span class="state-pill ${published ? "is-published" : "is-draft"}">
                ${published ? check : pencil}${published ? "منتشر شده" : "پیش‌نویس"}
            </span>
        </td>
        <td class="cell-num">
            <span class="stat-line">${eye}${fa(blog.viewCounter || 0)}</span>
            <span class="stat-line">${clock}${readingTime} دقیقه</span>
        </td>
        <td class="col-actions">
            <div class="row-actions">
                ${published ? `<a href="http://localhost:8080/blog/${encodeURIComponent(blog.slug)}" target="_blank" class="comment-action-btn" title="مشاهده">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
                    </svg></a>` : ""}
                <button data-href="http://localhost:8080/admin/blog-edit/${encodeURIComponent(blog.slug)}" onclick="window.location.href=this.dataset.href" class="comment-action-btn accept-btn" title="ویرایش">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                    </svg>
                </button>
                <button data-slug="${esc(blog.slug)}" onclick="showDeleteAlert(this.dataset.slug)" class="comment-action-btn delete-btn" title="حذف">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 7h14 M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2 M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13 M10 11v6 M14 11v6"/>
                    </svg>
                </button>
            </div>
        </td>
    </tr>`;
    }

    document.getElementById("status-filters").addEventListener("click", (e) => {
        const pill = e.target.closest(".filter-pill");
        if (!pill) return;
        activeFilter = pill.dataset.filter;
        document.querySelectorAll("#status-filters .filter-pill")
            .forEach(p => p.classList.toggle("is-active", p === pill));
        renderBlogs();
    });

    let pendingDeleteSlug = null;

    function showDeleteAlert(blogSlug) {
        pendingDeleteSlug = blogSlug;
        document.getElementById("glass-alert-title").innerText = "حذف بلاگ";
        document.getElementById("glass-alert-text").innerText =
            "آیا مطمئن هستید که می‌خواهید این بلاگ را حذف کنید؟ این عمل قابل بازگشت نیست.";
        document.getElementById("glass-alert-overlay").classList.add("is-open");
    }

    function hideGlassAlert() {
        document.getElementById("glass-alert-overlay").classList.remove("is-open");
        pendingDeleteSlug = null;
    }

    document.getElementById("cancel-delete-btn").addEventListener("click", hideGlassAlert);
    document.getElementById("glass-alert-close").addEventListener("click", hideGlassAlert);

    document.getElementById("confirm-delete-btn").addEventListener("click", async () => {
        if (!pendingDeleteSlug) return;

        await fetch("http://localhost:8080/blogs/" + encodeURIComponent(pendingDeleteSlug), {
            method: "DELETE"
        });

        hideGlassAlert();
        await loadBlogs();
    });

    function highlightTargetRow() {
        if (!targetSlug) return;

        const row = [...document.querySelectorAll("tr[data-slug]")].find(r => r.dataset.slug === targetSlug);
        if (!row) return;


        row.classList.remove("is-target");
        void row.offsetWidth;
        row.classList.add("is-target");

        row.scrollIntoView({behavior: "smooth", block: "center"});
    }

    window.addEventListener("load", () => {
        const loader = document.getElementById("page-loader");
        const revealNow = () => {
            document.querySelectorAll(".reveal").forEach((el, i) => {
                const delay = i * 70;
                el.style.transitionDelay = `${delay}ms`;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => el.classList.add("visible"));
                });
                setTimeout(() => {
                    el.style.transitionDelay = "";
                }, delay + 850);
            });
        };
        if (loader) {
            setTimeout(() => {
                loader.classList.add("is-hidden");
                revealNow();
            }, 450);
        } else {
            revealNow();
        }
    });

    loadBlogs();
</script>

<script>

    const themeToggle = document.getElementById("theme-toggle");
    const rootEl = document.documentElement;

    function applyTheme(theme) {
        rootEl.setAttribute("data-theme", theme);
        try {
            localStorage.setItem("derang-theme", theme);
        } catch (e) {
        }
    }

    if (themeToggle) {
        themeToggle.addEventListener("click", () => {
            const next = rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
            applyTheme(next);
        });
    }


    const cmdkData = [
        {title: "پنل مدیریت", sub: "بازگشت به صفحه اصلی مدیریت", href: "http://localhost:8080/admin", external: true},
        {title: "بلاگها", sub: "نوشتن، ویرایش و انتشار بلاگها", href: "http://localhost:8080/admin/blogs", external: true},
        {title: "کاربران", sub: "حساب‌های کاربری و دسترسی‌ها", href: "http://localhost:8080/admin/users", external: true},
        {title: "دیدگاه‌ها", sub: "بررسی، تأیید یا حذف دیدگاه‌ها", href: "http://localhost:8080/admin/comments", external: true},
        {title: "بازگشت به سایت", sub: "خروج از پنل مدیریت", href: "http://localhost:8080", external: true}
    ];

    const cmdkOverlay = document.getElementById("cmdk-overlay");
    const cmdkInput = document.getElementById("cmdk-input");
    const cmdkList = document.getElementById("cmdk-list");
    let cmdkActiveIndex = 0;
    let cmdkFiltered = cmdkData;

    function renderCmdk() {
        if (!cmdkFiltered.length) {
            cmdkList.innerHTML = `<p class="cmdk-empty">نتیجه‌ای پیدا نشد.</p>`;
            return;
        }
        cmdkList.innerHTML = cmdkFiltered.map((item, i) => `
            <div class="cmdk-item ${i === cmdkActiveIndex ? "is-active" : ""}" data-index="${i}">
                <svg class="cmdk-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                    <circle cx="12" cy="12" r="9"/>
                </svg>
                <div class="cmdk-item-text">
                    <span class="cmdk-item-title">${item.title}</span>
                    <span class="cmdk-item-sub">${item.sub}</span>
                </div>
            </div>
        `).join("");

        cmdkList.querySelectorAll(".cmdk-item").forEach((el) => {
            const i = parseInt(el.dataset.index, 10);
            el.addEventListener("click", () => goToCmdkItem(cmdkFiltered[i]));
            el.addEventListener("mousemove", () => {
                if (cmdkActiveIndex !== i) {
                    cmdkActiveIndex = i;
                    renderCmdk();
                }
            });
        });
    }

    function goToCmdkItem(item) {
        closeCmdk();
        if (item.external) {
            window.location.href = item.href;
            return;
        }
        const target = document.querySelector(item.href);
        if (target) target.scrollIntoView({behavior: "smooth", block: "start"});
    }

    function openCmdk() {
        cmdkOverlay.classList.add("is-open");
        document.body.style.overflow = "hidden";
        cmdkInput.value = "";
        cmdkFiltered = cmdkData;
        cmdkActiveIndex = 0;
        renderCmdk();
        setTimeout(() => cmdkInput.focus(), 50);
    }

    function closeCmdk() {
        cmdkOverlay.classList.remove("is-open");
        document.body.style.overflow = "";
    }

    if (cmdkInput) {
        cmdkInput.addEventListener("input", () => {
            const q = cmdkInput.value.trim().toLowerCase();
            cmdkFiltered = cmdkData.filter(item =>
                item.title.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q)
            );
            cmdkActiveIndex = 0;
            renderCmdk();
        });

        cmdkInput.addEventListener("keydown", (e) => {
            if (e.key === "ArrowDown") {
                e.preventDefault();
                cmdkActiveIndex = Math.min(cmdkActiveIndex + 1, cmdkFiltered.length - 1);
                renderCmdk();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                cmdkActiveIndex = Math.max(cmdkActiveIndex - 1, 0);
                renderCmdk();
            } else if (e.key === "Enter") {
                e.preventDefault();
                if (cmdkFiltered[cmdkActiveIndex]) goToCmdkItem(cmdkFiltered[cmdkActiveIndex]);
            }
        });
    }

    const searchTrigger = document.getElementById("search-trigger");
    if (searchTrigger) searchTrigger.addEventListener("click", openCmdk);

    if (cmdkOverlay) {
        cmdkOverlay.addEventListener("click", (e) => {
            if (e.target === cmdkOverlay) closeCmdk();
        });
    }

    document.addEventListener("keydown", (e) => {
        const isK = e.key.toLowerCase() === "k";
        if ((e.metaKey || e.ctrlKey) && isK) {
            e.preventDefault();
            if (cmdkOverlay.classList.contains("is-open")) {
                closeCmdk();
            } else {
                openCmdk();
            }
        }
        if (e.key === "Escape" && cmdkOverlay.classList.contains("is-open")) closeCmdk();
    });
</script>

</body>
</html>
